name: Compile DNS Blocklist

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Hostlist Compiler
        run: |
          npx @adguard/hostlist-compiler -c config.json -o filter.txt

      - name: Commit and Push compiled filter
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add filter.txt
          git diff --staged --quiet || (git commit -m "Auto-update compiled filter" && git push)
